# Dependency terms, not the licence of Clay Form itself. Keep all native targets
# and build dependencies in the inventory; font licences apply to font data.
accepted = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "BSL-1.0", "Zlib", "Unicode-3.0", "CC0-1.0", "OFL-1.1", "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin", "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

[clay-form]
accepted = ["GPL-3.0-only"]
