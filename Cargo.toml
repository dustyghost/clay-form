[package]
name = "clay-form"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
moxcms = "0.8.1"
earcutr = "0.5"
# eframe disables wgpu defaults; explicitly enable native backends.
wgpu = { version = "27", default-features = false, features = ["vulkan", "metal", "dx12", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.4"
