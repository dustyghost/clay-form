[package]
name = "clay-form"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
earcutr = "0.5"
