name: Native packages

on:
  pull_request:
    paths: ['src/**', 'Cargo.*', 'build.rs', 'rust-toolchain.toml', 'legal/**', 'about.toml', 'LICENSE', 'COPYRIGHT.md', 'THIRD-PARTY-NOTICES.html', 'packaging/**', 'scripts/*notices.py', 'scripts/*release.py', '.github/workflows/release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version; creates a draft release from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), 'Invalid version'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              assert os.environ['GITHUB_REF'] == 'refs/heads/main', 'Release from main only'
              assert os.environ['REQUESTED_VERSION'] == version, 'Version mismatch'
          elif os.environ['GITHUB_EVENT_NAME'] == 'push':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag/version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: python scripts/check-notices.py
      - run: python scripts/test-notices.py
      - run: python scripts/test-package-release.py
      - name: Require completed notice review for releases
        if: github.event_name != 'pull_request'
        run: python scripts/check-notices.py --release

  build:
    needs: prepare
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: windows-2022, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and native target
        run: |
          rustup show
          rustup target add '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev
      - name: Build native executable
        env:
          RELEASE_BUILD: ${{ github.event_name != 'pull_request' }}
        run: |
          if [[ "$RELEASE_BUILD" == true ]]; then
            cargo build --release --locked --target '${{ matrix.target }}'
          else
            cargo build --locked --target '${{ matrix.target }}'
          fi
      - name: Package and verify required notices
        env:
          RELEASE_BUILD: ${{ github.event_name != 'pull_request' }}
        run: |
          profile=debug
          if [[ "$RELEASE_BUILD" == true ]]; then profile=release; fi
          python scripts/package-release.py --target '${{ matrix.target }}' --profile "$profile"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  source:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Bundle exact tracked source and locked dependency sources
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/clay-form-v$VERSION-source"
          mkdir -p "$stage/.cargo" dist
          git archive HEAD | tar -x -C "$stage"
          cargo vendor --locked --versioned-dirs "$stage/vendor" > "$stage/.cargo/config.toml"
          python3 - "$stage/.cargo/config.toml" "$stage/vendor" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          p.write_text(p.read_text().replace(sys.argv[2], 'vendor'))
          PY
          git rev-parse HEAD > "$stage/SOURCE-COMMIT"
          # Prove the vendored configuration works after relocation, offline.
          mkdir -p "$RUNNER_TEMP/source-check"
          mv "$stage" "$RUNNER_TEMP/source-check/"
          relocated="$RUNNER_TEMP/source-check/clay-form-v$VERSION-source"
          (cd "$relocated" && cargo metadata --frozen --format-version 1 > /dev/null)
          tar -C "$RUNNER_TEMP/source-check" -czf "dist/clay-form-v$VERSION-source.tar.gz" "clay-form-v$VERSION-source"
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          path: dist/*-source.tar.gz
          if-no-files-found: error

  draft:
    if: github.event_name != 'pull_request'
    needs: [prepare, build, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo '::error::Release already exists; review it before attempting replacement.'
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          fi
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          title="Clay Form $tag"
          if [[ "$VERSION" =~ -alpha\.([0-9]+)$ ]]; then
            title="Clay Form Alpha ${BASH_REMATCH[1]} ($tag)"
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "$title" \
            --notes-file .github/RELEASE-NOTES.md "${prerelease[@]}"
