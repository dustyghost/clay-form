name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project Rust toolchain
        run: rustup show

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  graphics:
    name: Headless wgpu/Vulkan regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAY_GPU_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project Rust toolchain
        run: rustup show

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2

      - name: Install build and Mesa runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers

      - name: Run all GPU correctness checks
        # Keep pixel/depth/clipping checks and tests that exercise real controls.
        # Manual-only captures are documented in docs/gpu-rendering.md.
        run: |
          cargo test --locked --lib viewport::gpu:: -- --ignored --skip gpu_load_profile --test-threads=1
          cargo test --locked --lib diagnostic_export_dialog_offscreen_preview -- --ignored
          cargo test --locked --lib recovery_and_menu_placement_offscreen_preview -- --ignored
          cargo test --locked --lib obj_import_offscreen_preview -- --ignored
          cargo test --locked --lib material_controls_offscreen_review -- --ignored
          cargo test --locked --lib uv_texture_controls_offscreen_review -- --ignored
          cargo test --locked --lib uv_island_controls_offscreen_review -- --ignored
          cargo test --locked --lib viewport_lighting_offscreen_review -- --ignored
          cargo test --locked --lib reference_images_offscreen_preview -- --ignored
          cargo test --locked --lib navigation_and_smooth_offscreen_preview -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-flatten" cargo test --locked --lib flatten_stroke_offscreen_review -- --ignored
          cargo test --locked --lib perspective_view_offscreen_preview -- --ignored
          cargo test --locked --lib closed_cylinder_path_offscreen_preview -- --ignored
          cargo test --locked --lib live_detail_path_offscreen_preview -- --ignored
          cargo test --locked --lib one_drag_ring_authoring_offscreen_preview -- --ignored
          cargo test --locked --lib rounded_path_corners_offscreen_preview -- --ignored
          cargo test --locked --lib automatic_path_settings_offscreen_preview -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-alpha" cargo test --locked --lib alpha_library_stencil_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-file-pickers" cargo test --locked --lib asset_file_dialog_offscreen_review -- --ignored
          cargo test --locked --lib interchange_export_controls_offscreen_review -- --ignored
          cargo test --locked --lib paint_modes_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-visibility" cargo test --locked --lib visibility_selection_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-temporary-mask" cargo test --locked --lib temporary_mask_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-context-menu" cargo test --locked --lib viewport_context_menu_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-universal" cargo test --locked --lib universal_transform_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-shared-selection" cargo test --locked --lib shared_selection_offscreen_review -- --ignored
          CLAY_GUIDE_PREVIEW="$RUNNER_TEMP/clay-mesh-refinement" cargo test --locked --lib mesh_refinement_offscreen_review -- --ignored
